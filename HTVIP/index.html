<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>头像组件 - 完整版</title>
<style>
/* 头部基础 */
.header { position:relative; background:#111; color:#ffd700; padding:12px 20px; font-family:Arial; }
.logo { height:40px; vertical-align:middle; margin-right:12px; }

/* 头像切换 */
.account-toggle { position:absolute; top:10px; right:10px; }
#userPhoto { width:40px; height:40px; border-radius:50%; cursor:pointer; border:2px solid #ffd700; }

/* 下拉弹窗 */
.account-popup {
  display:none; position:absolute; top:50px; right:0;
  background:rgba(0,0,0,0.95); padding:15px; border-radius:8px;
  color:#fff; width:280px; box-shadow:0 0 15px rgba(255,215,0,0.3); z-index:9999;
}
.account-popup input { width:100%; margin:6px 0; padding:6px 8px; border-radius:6px; border:1px solid #8b6914; background:#1e1e1e; color:#f5deb3; }
.account-popup button { background:#000; color:#ffd700; border:1px solid #ffd700; padding:8px 12px; border-radius:5px; cursor:pointer; margin:4px 2px; font-weight:bold; }
.account-popup button:hover { background:#2b2b2b; color:#fff8dc; }

/* 预览 */
#userPhotoPreview { width:60px; height:60px; border-radius:50%; margin-top:6px; border:2px solid #ffd700; }
</style>
</head>
<body>
<div class="header">
  <a href="https://htcb-12c7.github.io/htgov/"><img class="logo" src="https://htcb-12c7.github.io/htgov/assets/HTgovIconV2.png" alt="logo"></a>
  黑铁工作室
  <div class="account-toggle">
    <img id="userPhoto" src="https://htcb-12c7.github.io/htgov/assets/login-placeholder.svg" alt="头像" onclick="toggleAccountInfo()">
    <div class="account-popup" id="accountPopup">
      <div id="loginForm">
        <input type="email" id="email" placeholder="邮箱/用户名">
        <input type="password" id="password" placeholder="密码">
        <br>
        <button id="loginBtn">登录</button>
        <button id="googleLoginBtn">使用 Google 登录</button>
      </div>
      <div id="userInfo" style="display:none;">
        <div>
          <label>头像：</label>
          <input type="file" id="updateAvatar" accept="image/*">
          <br><img id="userPhotoPreview" src="https://htcb-12c7.github.io/htgov/assets/login-placeholder.svg">
        </div>
        <div><label>昵称：</label><input id="userNickname"></div>
        <div><label>邮箱：</label><input id="userEmail"><button id="sendVerifyBtn">发送验证邮件</button></div>
        <div><label>支付方式：</label><input id="userPayMethod"></div>
        <div><label>支付名称：</label><input id="userPayName"></div>
        <div><label>支付账号：</label><input id="userPayAccount"></div>
        <br>
        <button id="saveBtn">保存</button>
        <button id="bindGoogleBtn">绑定 Google 账号</button>
        <button id="logoutBtn">退出登录</button>
      </div>
    </div>
  </div>
</div>

<script>
// 弹窗开关
function toggleAccountInfo(){
  const p = document.getElementById('accountPopup');
  p.style.display = p.style.display==='none' ? 'block' : 'none';
}

// 头像压缩预览
let newAvatarBase64 = null;
document.getElementById('updateAvatar').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 5*1024*1024){ alert('头像图片不能超过5MB！'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const max = 200;
      let w = img.width, h = img.height;
      if(w>h && w>max){ h*=max/w; w=max; } else if(h>max){ w*=max/h; h=max; }
      canvas.width = w; canvas.height = h;
      ctx.drawImage(img,0,0,w,h);
      newAvatarBase64 = canvas.toDataURL('image/jpeg',0.85);
      document.getElementById('userPhotoPreview').src = newAvatarBase64;
      document.getElementById('userPhoto').src = newAvatarBase64;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// 这里放你的 Firebase 初始化和登录/保存逻辑
// 例如：loginBtn.onclick = ... ; saveBtn.onclick = ... ;
// 保存时把 newAvatarBase64 上传到 Storage / 数据库
</script>
</body>
</html>
