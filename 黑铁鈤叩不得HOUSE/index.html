<script>
const songs = [
      "https://htcb-12c7.github.io/htgov/assets/我的童话不是梦.m4a"
      "https://htcb-12c7.github.io/htgov/assets/童话.mp3"
      "https://htcb-12c7.github.io/htgov/assets/勇气大爆发 (压缩).mp3"
  // 可以在这里添加更多歌曲URL
];

const bgm = document.getElementById("bgm");
const titleBox = document.createElement("div");
titleBox.style.cssText = `
  position: fixed; bottom: 8px; right: 12px;
  color: gold; font-size: 14px; font-weight: bold;
  text-shadow: 0 0 5px black; z-index: 9999;
`;
document.body.appendChild(titleBox);

let currentSongIndex = 0;

// ✅ 按顺序播放下一首歌曲
function playNextSong() {
  if (songs.length === 0) return;
  
  const song = songs[currentSongIndex];
  bgm.src = song;
  bgm.play().catch(err => console.log("播放失败：", err));
  titleBox.textContent = "🎵 正在播放：" + decodeURIComponent(song.split("/").pop());
  
  // 更新索引，循环播放
  currentSongIndex = (currentSongIndex + 1) % songs.length;
}

// ✅ 点击或按键解除静音
function enableBgm() {
  bgm.muted = false;
  bgm.play().catch(err => console.log("播放失败：", err));
}

document.addEventListener('click', enableBgm, { once: true });
document.addEventListener('keydown', enableBgm, { once: true });
document.addEventListener('touchstart', enableBgm, { once: true });

// ✅ 每首歌播完自动播放下一首
bgm.addEventListener("ended", playNextSong);

// ✅ 页面加载时开始播放
window.addEventListener("load", playNextSong);
</script>

        // 转换为本地时区的YYYY-MM-DD格式
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;

        const day = String(date.getDate()).padStart(2, '0');

        if (!notes) return;
        
        const now = new Date();
        
        Object.keys(notes).forEach(noteId => {
          const note = notes[noteId];
          const noteElement = createNoteElement(noteId, note);
          
          if (note.completed) {
            completedNotesContainer.appendChild(noteElement);
          } else if (note.finalDueDate && new Date(note.finalDueDate) < now) {
            overdueNotesContainer.appendChild(noteElement);
          } else {
            activeNotesContainer.appendChild(noteElement);
          }
        });
      }

      // 创建便签DOM元素
      function createNoteElement(noteId, note) {
        const noteDiv = document.createElement('div');
        noteDiv.className = 'note';
        
        if (note.completed) {
          noteDiv.classList.add('completed');
        }
        
        const now = new Date();
        if (note.finalDueDate && new Date(note.finalDueDate) < now && !note.completed) {
          noteDiv.classList.add('overdue');
        }
        
        let tagHtml = '';
        if (note.completed) {
          tagHtml = '<span class="note-tag tag-completed">已完成</span>';
        } else if (note.finalDueDate && new Date(note.finalDueDate) < now) {
          tagHtml = '<span class="note-tag tag-overdue">已截至</span>';
        }
        
        let dateInfo = '';
        if (note.startDate || note.dueDate || note.finalDueDate) {
          dateInfo = `<div class="note-date">`;
          if (note.startDate) dateInfo += `开始: ${formatDate(note.startDate)} `;
          if (note.dueDate) dateInfo += `预计: ${formatDate(note.dueDate)} `;
          if (note.finalDueDate) dateInfo += `截止: ${formatDate(note.finalDueDate)}`;
          dateInfo += `</div>`;
        }
        
        noteDiv.innerHTML = `
          <div class="note-header">
            <h3 class="note-title">${note.title}</h3>
            ${tagHtml}
          </div>
          ${dateInfo}
          <div class="note-content">${note.content || ''}</div>
          <div class="note-actions">
            <button class="btn btn-primary" onclick="editNote('${noteId}')">编辑</button>
            <button class="btn btn-danger" onclick="deleteNote('${noteId}')">删除</button>
            ${!note.completed ? `<button class="btn" onclick="toggleComplete('${noteId}', true)">完成</button>` : 
              `<button class="btn" onclick="toggleComplete('${noteId}', false)">未完成</button>`}
          </div>
        `;
        
        return noteDiv;
      }

      // 编辑便签
      window.editNote = function(noteId) {
        const user = auth.currentUser;
        if (!user) return;
        
        const noteRef = ref(db, `users/${user.uid}/JapNoHOUSE/${noteId}`);
        get(noteRef).then((snapshot) => {
          if (snapshot.exists()) {
            const note = snapshot.val();
            document.getElementById('noteTitle').value = note.title || '';
            document.getElementById('noteContent').value = note.content || '';
            // 使用修复后的日期格式化函数
            document.getElementById('startDate').value = formatDateForInput(note.startDate) || '';
            document.getElementById('dueDate').value = formatDateForInput(note.dueDate) || '';
            document.getElementById('finalDueDate').value = formatDateForInput(note.finalDueDate) || '';
            document.getElementById('reminder').checked = note.reminder || false;
            
            currentEditingNoteId = noteId;
            document.getElementById('modalTitle').textContent = '编辑便签';
            noteModal.style.display = 'flex';
          }
        });
      }

      // 删除便签
      window.deleteNote = function(noteId) {
        if (!confirm('确定要删除这个便签吗？')) return;
        
        const user = auth.currentUser;
        if (!user) return;
        
        const noteRef = ref(db, `users/${user.uid}/JapNoHOUSE/${noteId}`);
        remove(noteRef).catch(error => {
          console.error("删除便签失败:", error);
          alert("删除便签失败，请重试");
        });
      }

      // 切换完成状态
      window.toggleComplete = function(noteId, completed) {
        const user = auth.currentUser;
        if (!user) return;
        
        const noteRef = ref(db, `users/${user.uid}/JapNoHOUSE/${noteId}`);
        get(noteRef).then((snapshot) => {
          if (snapshot.exists()) {
            const note = snapshot.val();
            set(noteRef, {
              ...note,
              completed: completed,
              updatedAt: new Date().toISOString()
            }).catch(error => {
              console.error("更新便签失败:", error);
              alert("更新便签失败，请重试");
            });
          }
        });
      }

      // 检查到期提醒
      function checkReminders(notes) {
        if (!notes) return;
        
        const now = new Date();
        let hasReminders = false;
        let reminderMessage = '';
        
        Object.keys(notes).forEach(noteId => {
          const note = notes[noteId];
          if (note.reminder && !note.completed && note.finalDueDate) {
            const dueDate = new Date(note.finalDueDate);
            // 检查是否即将到期（3天内）
            const daysUntilDue = Math.ceil((dueDate - now) / (1000 * 60 * 60 * 24));
            
            if (daysUntilDue <= 3 && daysUntilDue >= 0) {
              hasReminders = true;
              reminderMessage += `"${note.title}" 将在 ${daysUntilDue} 天后到期\n`;
            } else if (daysUntilDue < 0) {
              hasReminders = true;
              reminderMessage += `"${note.title}" 已过期 ${Math.abs(daysUntilDue)} 天\n`;
            }
          }
        });
        
        if (hasReminders && reminderMessage) {
          // 使用alert显示提醒
          setTimeout(() => {
            alert('到期提醒:\n\n' + reminderMessage);
          }, 1000);
        }
      }

      // 请求通知权限
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      // 登录功能
      document.getElementById("loginBtn").onclick = async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        if (!email || !password) {
          alert("请输入邮箱和密码");
          return;
        }
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          alert("登录失败: " + err.message);
        }
      };

      // Google 登录
      document.getElementById("googleLoginBtn").onclick = async () => {
        try {
          await signInWithPopup(auth, provider);
        } catch (err) {
          alert("Google 登录失败: " + err.message);
        }
      };

      // 绑定 Google
      document.getElementById("bindGoogleBtn").onclick = async () => {
        const user = auth.currentUser;
        if (!user) return alert("请先登录");
        try {
          await linkWithPopup(user, provider);
          alert("Google 账号绑定成功！");
        } catch (err) {
          alert("绑定失败: " + err.message);
        }
      };

      // 邮箱验证
      document.getElementById("sendVerifyBtn").onclick = async () => {
        const user = auth.currentUser;
        if (!user) return alert("请先登录");
        const newEmail = document.getElementById("userEmail").value;
        try {
          await updateEmail(user, newEmail);
          await sendEmailVerification(user);
          alert("验证邮件已发送，请检查邮箱");
        } catch (err) {
          alert("发送失败: " + err.message);
        }
      };

      // 保存用户信息 + 上传头像
      let newAvatarFile = null;
      document.getElementById("updateAvatar").addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 27 * 1024 * 1024) {
          alert("图片大小不能超过27MB！");
          return;
        }
        newAvatarFile = file;
        document.getElementById("userPhotoPreview").src = URL.createObjectURL(file);
      });

      document.getElementById("saveBtn").onclick = async () => {
        const user = auth.currentUser;
        if (!user) return alert("请先登录");

        let avatarURL = document.getElementById("userPhoto").src;

        if (newAvatarFile) {
          const fileRef = sRef(storage, "avatars/" + user.uid + ".jpg");
          await uploadBytes(fileRef, newAvatarFile);
          avatarURL = await getDownloadURL(fileRef);
          document.getElementById("userPhoto").src = avatarURL;
        }

        const userRef = ref(db, "users/" + user.uid);
        await set(userRef, {
          nickname: document.getElementById("userNickname").value,
          email: document.getElementById("userEmail").value,
          payMethod: document.getElementById("userPayMethod").value,
          payName: document.getElementById("userPayName").value,
          payAccount: document.getElementById("userPayAccount").value,
          avatar: avatarURL
        });

        alert("信息已更新！");
      };

      // 登出
      document.getElementById("logoutBtn").onclick = () => {
        signOut(auth);
      };

      // 登录状态监听
      onAuthStateChanged(auth, async (user) => {
        const defaultAvatar = "https://htcb-12c7.github.io/htgov/assets/login-placeholder.svg";
        
        if (user) {
          document.getElementById("loginForm").style.display = "none";
          document.getElementById("userInfo").style.display = "block";
          document.getElementById("userPhoto").src = user.photoURL || defaultAvatar;

          const userRef = ref(db, "users/" + user.uid);
          const snapshot = await get(userRef);
          if (snapshot.exists()) {
            const data = snapshot.val();
            document.getElementById("userNickname").value = data.nickname || "";
            document.getElementById("userEmail").value = data.email || user.email || "";
            document.getElementById("userPayMethod").value = data.payMethod || "";
            document.getElementById("userPayName").value = data.payName || "";
            document.getElementById("userPayAccount").value = data.payAccount || "";

            document.getElementById("userPhoto").src = data.avatar || user.photoURL || defaultAvatar;
            document.getElementById("userPhotoPreview").src = data.avatar || user.photoURL || defaultAvatar;
          }
          
          // 用户已登录，显示便签功能
          loginRequired.style.display = 'none';
          notesArea.style.display = 'block';
          addNoteBtn.style.display = 'block';
          
          // 加载用户的便签
          loadUserNotes(user.uid);
        } else {
          document.getElementById("loginForm").style.display = "block";
          document.getElementById("userInfo").style.display = "none";
          document.getElementById("userPhoto").src = defaultAvatar;
          
          // 用户未登录，隐藏便签功能
          loginRequired.style.display = 'block';
          notesArea.style.display = 'none';
          addNoteBtn.style.display = 'none';
        }
      });
    </script>
</body>
</html>
